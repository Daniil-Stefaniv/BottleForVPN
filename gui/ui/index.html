<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BottleForApps</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <h1>BottleForApps</h1>

      <nav id="tabs">
        <button class="tab active" data-screen="list">Бутылки</button>
        <button class="tab" data-screen="create" disabled>Создать</button>
        <button class="tab" data-screen="doctor" disabled>Диагностика</button>
      </nav>

      <section id="screen-list" class="screen">
        <table id="bottles"></table>
      </section>
      <!-- Экраны create/doctor подключаются в Task 4. -->

      <section id="daemon-panel" hidden>
        <p id="daemon-hint"></p>
        <button id="daemon-start">Запустить демона</button>
        <pre id="daemon-log"></pre>
      </section>

      <div id="toast" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
