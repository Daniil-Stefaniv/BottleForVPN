<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Погребок</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <header id="app-header">
        <span id="app-title">🍾 Погребок</span>
        <nav id="tabs">
          <button class="tab active" data-screen="env">Env · 0</button>
          <button class="tab" data-screen="host">Host · 0</button>
          <button class="tab" data-screen="doctor">Диагностика</button>
        </nav>
        <button id="create-open" type="button" title="Новая бутылка">
          + Создать бутылку
        </button>
      </header>

      <section id="screen-bottles" class="screen screen-grid">
        <div class="grid-row grid-head">
          <span>Бутылка</span><span>Статус</span><span></span><span></span><span></span>
        </div>
        <div id="bottle-grid"></div>
        <p id="grid-empty" class="muted" hidden>
          Здесь пусто — создайте первую бутылку кнопкой выше.
        </p>
      </section>

      <section id="screen-doctor" class="screen" hidden>
        <div class="doctor-wrap">
          <div id="doctor-head">
            <div>
              <h2>Диагностика</h2>
              <p id="doctor-summary" class="muted"></p>
            </div>
            <div class="doctor-actions">
              <button id="doctor-refresh" type="button">Проверить снова</button>
              <button id="appliance-upgrade" type="button" title="Пере-импорт аплаенса из свежего rootfs (бутылки должны быть остановлены)">
                Обновить аплаенс
              </button>
              <button id="appliance-reset" type="button" title="Остановить все бутылки, перезапустить WSL и переустановить аплаенс с нуля">
                Сбросить аплаенс
              </button>
            </div>
          </div>

          <!-- Статус-карты (0.3): daemon_stats по таймеру при живом демоне. -->
          <div id="stats-cards"></div>

          <!-- Живая консоль: единая лента событий демона и GUI. -->
          <div id="console">
            <div id="console-toolbar">
              <div class="chips" id="chips-src"></div>
              <div class="chips" id="chips-level"></div>
              <div class="chips" id="chips-cat"></div>
              <input id="console-search" placeholder="Поиск по событиям…" />
              <button id="console-pause" type="button">Пауза</button>
            </div>
            <div class="console-row console-head">
              <span>Время</span>
              <span>Уровень</span>
              <span>Источник</span>
              <span>Событие</span>
              <span>Описание</span>
            </div>
            <div id="console-list"></div>
            <div id="console-foot">
              <button id="logs-export" type="button">Собрать логи (ZIP)</button>
              <button id="logs-open-dir" type="button">Открыть папку логов</button>
              <span class="spacer"></span>
              <span id="console-count" class="muted"></span>
            </div>
          </div>

          <div id="doctor-list"></div>
          <p id="logs-path" hidden></p>
        </div>
      </section>

      <footer id="cmdbar">
        <span id="cmd-status" class="status-item">
          <span class="dot dot-muted"></span>демон
        </span>
        <button id="cmd-daemon-start" type="button" hidden>Запустить демона</button>
        <button id="cmd-daemon-stop" type="button" class="danger" hidden>
          Остановить демона
        </button>
        <button id="cmd-console" type="button" title="Консоль состояний и журнала">
          Консоль
        </button>
        <span class="spacer"></span>
        <span id="cmd-updated" class="status-item muted"></span>
      </footer>

      <div id="toast" hidden></div>

      <!-- Экран блокировки (0.3): поверх главного, без пароля не пускает. -->
      <div id="lock-root" hidden></div>

      <dialog id="creds-dialog">
        <form id="creds-form">
          <h2>Логин и пароль</h2>
          <p class="section-hint">
            Бутылка «<span id="creds-bottle-id"></span>» · хранятся в
            зашифрованной БД, демон получает их только в память при старте.
          </p>
          <div class="field">
            <label for="creds-username">Логин</label>
            <input id="creds-username" autocomplete="username" />
          </div>
          <div class="field">
            <label for="creds-password">Пароль</label>
            <input id="creds-password" type="password" autocomplete="current-password" />
          </div>
          <p id="creds-error" hidden></p>
          <div class="form-actions">
            <button type="submit" id="creds-submit" class="primary">Сохранить</button>
            <button type="button" id="creds-cancel">Отмена</button>
          </div>
        </form>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
