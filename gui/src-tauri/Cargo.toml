[package]
name = "bottle-gui"
version = "0.2.3"
description = "BottleForApps — графический интерфейс управления бутылками"
edition = "2021"
rust-version = "1.85"

# Отдельный от корня workspace: Tauri приносит свою экосистему
# зависимостей и не должен попадать в общий lock/deny-набор ядра.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }

[profile.release]
strip = true
lto = true

[dev-dependencies]
tempfile = "3"
libc = "0.2"
