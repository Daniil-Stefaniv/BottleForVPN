[package]
name = "bottle-gui"
version = "0.2.7"
description = "BottleForApps — графический интерфейс управления бутылками"
edition = "2021"
rust-version = "1.85"

# Отдельный от корня workspace: Tauri приносит свою экосистему
# зависимостей и не должен попадать в общий lock/deny-набор ядра.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Хранилище GUI (0.3): SQLCipher со статической линковкой — ничего
# ставить на машину пользователя не нужно (спека §4).
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
# Профили бутылок — те же serde-структуры, что у демона (спека §4:
# параллельной модели не плодим).
bottle-core = { path = "../../crates/core" }
# Каталог профилей 0.2.x для миграции (%LOCALAPPDATA%\BottleForApps\bottles).
dirs = "5"
# Клиент демона (0.3): кадры LengthJsonCodec поверх UDS/named pipe.
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
# Токен авторизации GUI→демон (та же зависимость, что у демона).
getrandom = "0.3"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util"] }

[profile.release]
strip = true
lto = true

[dev-dependencies]
tempfile = "3"
libc = "0.2"
