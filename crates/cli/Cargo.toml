[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "pogrebok"
path = "src/main.rs"

[dependencies]
bottle-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
# Обмен с демоном: кадры LengthJsonCodec по named pipe; json-режим
# печатает CliReply как есть (контракт GUI, M4).
bytes = "1"
serde_json = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2"

# Named pipe клиента и коды ошибок Win32.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
