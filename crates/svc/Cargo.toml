[package]
name = "svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "svc"

[[bin]]
name = "bottle-svc"
path = "src/main.rs"

[dependencies]
bottle-core = { path = "../core" }
# Внутренний runtime службы: pipe-сервер (named pipe + FramedRead),
# graceful-остановка, run_ps: процесс PowerShell с таймаутом.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "net", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Файловый JSONL-журнал службы: ежедневная ротация (M3).
tracing-appender = "0.2"
# Кадры LengthJsonCodec pipe-сервера (SVC_PIPE) + CancellationToken.
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
bytes = "1"
# RouteOpError в routes.rs, JournalError в journal.rs.
thiserror = "2"
# Записи журнала маршрутов (JSONL): JournalRecord в journal.rs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Тесты журнала работают во временном каталоге.
tempfile = "3"
# Тесты ретеншна журналов ставят файлам mtime «31 день назад».
filetime = "0.2"

# Обвязка Windows-службы: SCM dispatcher, install/uninstall, статусы;
# DACL именованного канала (SDDL → SECURITY_ATTRIBUTES) и коды ошибок
# канала в тестах.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
