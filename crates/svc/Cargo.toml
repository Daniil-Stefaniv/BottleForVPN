[package]
name = "svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "svc"

[[bin]]
name = "bottle-svc"
path = "src/main.rs"

[dependencies]
bottle-core = { path = "../core" }
# Внутренний runtime службы: сервер-заглушка (Task 6 подключит pipe),
# graceful-остановка в консольном режиме — по Ctrl+C; run_ps: процесс
# PowerShell с таймаутом.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# RouteOpError в routes.rs.
thiserror = "2"

# Обвязка Windows-службы: SCM dispatcher, install/uninstall, статусы.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
