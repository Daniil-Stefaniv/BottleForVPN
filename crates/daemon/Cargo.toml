[package]
name = "daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "bottled"
path = "src/main.rs"

[dependencies]
bottle-core = { path = "../core" }
# Хост-сторона data-plane: serve_forward (127.0.0.1:port → vm_ip:port).
relay-lib = { path = "../relay-lib" }
# dyn-совместимый трейт WslRunner (async fn в трейте не dyn-совместимны).
async-trait = "0.1"
# Токен аплаенса: 32 случайных байта (на unix — getentropy/urandom,
# на Windows — RtlGenRandom; общий паттерн с agent/token.rs).
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bytes = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
# Каталог данных по умолчанию (кроссплатформенный local data dir).
dirs = "5"

# Single-instance демона: CreateMutexW (Win32).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
# Тесты хранилища и диспетчера работают во временных каталогах.
tempfile = "3"
