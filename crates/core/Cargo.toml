[package]
name = "bottle-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "bottle_core"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
# UDS-клиент читает кадры через FramedRead (M4 Task 7).
tokio-stream = "0.1"
# Каталог данных по умолчанию (CLI и демон считают его одинаково).
dirs = "5"

[dev-dependencies]
# Тесты UDS-клиента работают во временном каталоге.
tempfile = "3"
