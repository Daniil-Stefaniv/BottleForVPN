[package]
name = "agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "bottle-agent"
path = "src/main.rs"

[dependencies]
bottle-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
serde = "1"
thiserror = "2"
tracing = "0.1"
bytes = "1"
