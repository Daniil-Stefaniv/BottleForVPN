[package]
name = "agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "bottle-agent"
path = "src/main.rs"

[dependencies]
bottle-core = { path = "../core" }
relay-lib = { path = "../relay-lib" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bytes = "1"
# boot_cleanup завершает осиротевшие relay/туннели сигналами (kill(2)).
libc = "0.2"

[dev-dependencies]
# Интеграционные тесты (wg_handshake, bottles_e2e, openvpn_e2e) входят в
# network namespace через setns(2) из libc (dependencies): echo-сервер
# теста слушает в srv-namespace на адресе туннельного интерфейса.
