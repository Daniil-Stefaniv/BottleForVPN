name: CI

on:
  push:
  pull_request:

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      # Поведенческий тест маршрутов bottle-svc: реальный ActiveStore,
      # add/del точечного маршрута через шлюз по умолчанию (раннер
      # под администратором).
      - run: cargo test -p svc --test routes_win -- --ignored
      # Поведенческий тест службы целиком: install → RPC (Hello/Add/
      # List) → обрыв соединения демона → маршруты сессии сняты ≤10 с →
      # сверка журнала при повторном старте подбирает сироту → uninstall.
      - run: cargo test -p svc --test svc_win -- --ignored

  agent-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iptables wireguard-tools wireguard-go openvpn
      # Все root-интеграционные тесты (netns_lifecycle, wg_handshake,
      # bottles_e2e, openvpn_e2e) — #[ignore].
      - run: sudo -E cargo test -p agent -- --ignored

  appliance-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Сборка rootfs-апплайенса (Alpine + bottle-agent) и smoke внутри docker.
      - run: bash appliance/build-rootfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bottleforapps-rootfs
          path: artifacts/bottleforapps-rootfs.tar.gz

  # GUI (Tauri, M4 Task 2): ESLint, тесты Rust-моста и сборка bottle-gui
  # на обеих ОС. Артефакт — бинарь release; бандлы (.app/MSI-встраивание)
  # собирают релизные джобы (Task 6/11), здесь достаточно --no-bundle.
  gui-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: bottle-gui.exe
          - os: macos-14
            binary: bottle-gui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install
        working-directory: gui
        run: npm install
      - name: ESLint (TS)
        working-directory: gui
        run: npm run lint
      - name: Vitest (TS-логика экранов)
        working-directory: gui
        run: npm run test
      - name: fmt + clippy (Rust-мост)
        working-directory: gui/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Тесты Rust-моста run_bottle
        working-directory: gui/src-tauri
        run: cargo test
      - name: Сборка bottle-gui (release, без бандла)
        working-directory: gui
        run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: bottle-gui-${{ matrix.os }}
          path: gui/src-tauri/target/release/${{ matrix.binary }}


  # Полный вертикальный срез env-бутылки на Windows: bottled + bottle CLI
  # + импорт аплаенса + WG-туннель (стенд-сервер в той же WSL-VM) + SOCKS5.
  # Спека §15: WSL2 на CI-раннерах ограничен, поэтому до приёмки M2 фейл
  # джобы не роняет пайплайн (фолбэк — agent-integration на Linux-раннере).
  wsl-integration:
    runs-on: windows-latest
    needs: appliance-build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # WSL идемпотентно: на свежих runner-образах обычно уже включён —
      # тогда установка пропускается по коду возврата `wsl --status`.
      - name: Включить WSL (без дистрибутива)
        shell: powershell
        run: |
          wsl --status
          if ($LASTEXITCODE -ne 0) { wsl --install --no-distribution }
      - name: Скачать артефакт rootfs
        uses: actions/download-artifact@v4
        with:
          name: bottleforapps-rootfs
      - name: Собрать bottled и bottle
        run: cargo build --release -p daemon -p cli
      - name: WSL-интеграционный сценарий (env-бутылка + WG-стенд)
        shell: cmd
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci-wsl-integration.ps1
          -Rootfs "%GITHUB_WORKSPACE%\bottleforapps-rootfs.tar.gz"
          -Bottled "%GITHUB_WORKSPACE%\target\release\bottled.exe"
          -Bottle "%GITHUB_WORKSPACE%\target\release\bottle.exe"
          -DataDir "%RUNNER_TEMP%\bfa-ci-data"

  # Релизная сборка (по тегу v*): rootfs из appliance-build, portable-
  # zip и MSI, SHA256SUMS; публикация GitHub Release с русским текстом.
  release-build:
    runs-on: windows-latest
    needs: appliance-build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Скачать rootfs аплаенса
        uses: actions/download-artifact@v4
        with:
          name: bottleforapps-rootfs
      - name: Тег обязан совпадать с версией workspace
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq 'daemon' }).version
          if ($tag -ne $version) {
            throw "тег v$tag не совпадает с версией workspace $version — поправьте [workspace.package].version или тег"
          }
      - name: Собрать release-бинарники
        run: cargo build --release -p daemon -p cli -p svc
      - name: Portable-сборка
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-portable.ps1 -RootfsPath bottleforapps-rootfs.tar.gz
      - name: MSI-сборка
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/msi/build-msi.ps1 -RootfsPath bottleforapps-rootfs.tar.gz
      - name: SHA256SUMS
        shell: pwsh
        run: |
          Get-Content artifacts/*.sha256 | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt
      - name: Загрузить релизные файлы
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            artifacts/*.msi
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
      # Подпись кода отсутствует осознанно (спека «Что НЕ входит»):
      # SmartScreen предупреждает о неподписанном MSI — README релиза
      # это объясняет. Шаг подписи появится здесь после покупки
      # сертификата (заккомментированный каркас).
      # - name: Подпись
      #   run: signtool sign /fd SHA256 /tr <timestamper> /td SHA256 artifacts/*.msi
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            BottleForApps ${{ github.ref_name }}

            - MSI (полная установка: служба маршрутов, WSL, PATH; один UAC)
            - Portable ZIP (без прав администратора; только env-бутылки)

            Внимание: установщики не подписаны — SmartScreen покажет
            предупреждение («Все равно выполнить»). Контрольные суммы —
            в SHA256SUMS.txt.

            Первые шаги после установки MSI: запустите bottled.exe (или
            ярлык), затем `bottle doctor` и `bottle create ...`.
            Portable: распакуйте и читайте INSTALL.txt.
          files: |
            artifacts/*.msi
            artifacts/*.zip
            artifacts/SHA256SUMS.txt

  # Поведенческий smoke установки (по тегу): MSI тихо ставится и
  # сносится (файлы, служба, CLI); portable-распаковка отвечает.
  install-smoke:
    runs-on: windows-latest
    needs: release-build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Скачать релизные файлы
        uses: actions/download-artifact@v4
        with:
          name: release-files
      - name: msiexec install
        shell: cmd
        run: |
          for %%f in (*.msi) do msiexec /i "%%f" /qn /l*v install.log
          if %ERRORLEVEL% NEQ 0 ( type install.log & exit /b 1 )
      - name: Проверки установленного
        shell: pwsh
        run: |
          $dir = 'C:\Program Files\BottleForApps'
          foreach ($f in 'bottle.exe','bottled.exe','bottle-svc.exe','appliance\bottleforapps-rootfs.tar.gz') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "нет файла: $f" }
          }
          sc.exe query BottleForAppsRouteHelper
          if ($LASTEXITCODE -ne 0) { throw 'служба BottleForAppsRouteHelper не установлена' }
          & "$dir\bottle.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'bottle --version не работает' }
      - name: msiexec uninstall и чистота
        shell: cmd
        run: |
          for %%f in (*.msi) do msiexec /x "%%f" /qn /l*v uninstall.log
          if %ERRORLEVEL% NEQ 0 ( type uninstall.log & exit /b 1 )
      - name: Проверка удаления
        shell: pwsh
        run: |
          if (Test-Path 'C:\Program Files\BottleForApps') { throw 'каталог Program Files\BottleForApps пережил uninstall' }
          sc.exe query BottleForAppsRouteHelper
          if ($LASTEXITCODE -eq 0) { throw 'служба пережила uninstall' }
      - name: Portable — распаковка и отклик
        shell: pwsh
        run: |
          $zip = (Get-ChildItem *.zip).FullName
          Expand-Archive $zip -DestinationPath portable
          $bottle = (Get-ChildItem portable -Recurse -Filter bottle.exe | Select-Object -First 1).FullName
          & $bottle --version
          if ($LASTEXITCODE -ne 0) { throw 'portable bottle --version не работает' }
          # doctor portable-ветки: демон в фоне, служба НЕ ставилась —
          # только проверяем, что CLI отвечает отчётом, не крашится.
          $bottled = $bottle -replace 'bottle\.exe$','bottled.exe'
          $proc = Start-Process $bottled -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 5
            & $bottle doctor
            if ($LASTEXITCODE -eq -1) { throw 'bottle doctor аварийно завершился' }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
