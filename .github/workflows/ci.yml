name: CI

on:
  push:
  pull_request:

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      # Поведенческий тест маршрутов bottle-svc: реальный ActiveStore,
      # add/del точечного маршрута через шлюз по умолчанию (раннер
      # под администратором).
      - run: cargo test -p svc --test routes_win -- --ignored

  agent-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iptables wireguard-tools wireguard-go
      # Все root-интеграционные тесты (netns_lifecycle, wg_handshake) — #[ignore].
      - run: sudo -E cargo test -p agent -- --ignored

  appliance-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Сборка rootfs-апплайенса (Alpine + bottle-agent) и smoke внутри docker.
      - run: bash appliance/build-rootfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bottleforapps-rootfs
          path: artifacts/bottleforapps-rootfs.tar.gz

  # Полный вертикальный срез env-бутылки на Windows: bottled + bottle CLI
  # + импорт аплаенса + WG-туннель (стенд-сервер в той же WSL-VM) + SOCKS5.
  # Спека §15: WSL2 на CI-раннерах ограничен, поэтому до приёмки M2 фейл
  # джобы не роняет пайплайн (фолбэк — agent-integration на Linux-раннере).
  wsl-integration:
    runs-on: windows-latest
    needs: appliance-build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # WSL идемпотентно: на свежих runner-образах обычно уже включён —
      # тогда установка пропускается по коду возврата `wsl --status`.
      - name: Включить WSL (без дистрибутива)
        shell: powershell
        run: |
          wsl --status
          if ($LASTEXITCODE -ne 0) { wsl --install --no-distribution }
      - name: Скачать артефакт rootfs
        uses: actions/download-artifact@v4
        with:
          name: bottleforapps-rootfs
      - name: Собрать bottled и bottle
        run: cargo build --release -p daemon -p cli
      - name: WSL-интеграционный сценарий (env-бутылка + WG-стенд)
        shell: cmd
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci-wsl-integration.ps1
          -Rootfs "%GITHUB_WORKSPACE%\bottleforapps-rootfs.tar.gz"
          -Bottled "%GITHUB_WORKSPACE%\target\release\bottled.exe"
          -Bottle "%GITHUB_WORKSPACE%\target\release\bottle.exe"
          -DataDir "%RUNNER_TEMP%\bfa-ci-data"
