name: CI

on:
  push:
  pull_request:

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  agent-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iptables wireguard-tools wireguard-go
      # Все root-интеграционные тесты (netns_lifecycle, wg_handshake) — #[ignore].
      - run: sudo -E cargo test -p agent -- --ignored

  appliance-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Сборка rootfs-апплайенса (Alpine + bottle-agent) и smoke внутри docker.
      - run: bash appliance/build-rootfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bottleforapps-rootfs
          path: artifacts/bottleforapps-rootfs.tar.gz
